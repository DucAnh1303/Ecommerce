server:
  port: 8089
spring:
  profiles:
    active: dev
  application:
    name: AUTH-SERVICE
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: auth
    password: 123456
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

logging:
  file:
    path: /Users/aidenphung/Documents/ShopDA/Log_BE/Auth_Logs

jwt:
  issuer: ${JWT_ISSUER:shopda-auth}
  accessExp: 3600000
  refreshExp: 10800000
  rsa:
    # PKCS#8 PEM. Production: JWT_PRIVATE_KEY_LOCATION=file:/run/secrets/private_key.pem
    private-key-location: ${JWT_PRIVATE_KEY_LOCATION:classpath:keys/private_key.pem}

