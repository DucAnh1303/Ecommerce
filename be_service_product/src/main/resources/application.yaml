spring:
  profiles:
    active: dev
  application:
    name: PRODUCT-SERVICE
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/product_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:product}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  # ─── Kafka ──────────────────────────────────────────────────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: product-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: "java.util.Map"

  # ─── Redis (Blacklist token check) ──────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 500ms

server:
  port: 8088

app:
  auth-service:
    url: ${AUTH_SERVICE_URL:http://localhost:8089}
  order-service:
    url: ${ORDER_SERVICE_URL:http://localhost:8087}

# ─── JWT (RS256 – verify bằng public key lấy từ JWKS của AUTH-SERVICE) ────────
jwt:
  issuer: ${JWT_ISSUER:shopda-auth}
  jwks-uri: ${JWT_JWKS_URI:${app.auth-service.url}/api/v1/auth/.well-known/jwks.json}
  jwks-min-refresh-interval: 30s
  clock-skew: 30s
  blacklist:
    enabled: ${JWT_BLACKLIST_ENABLED:true}
    prefix: "blacklist:"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

logging:
  file:
    path: /Users/aidenphung/Documents/ShopDA/Log_BE/Product_Logs

