#      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
#  instance:
#    prefer-ip-address: true

# ─── Swagger ─────────────────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

# ─── Resilience4j Rate Limiter ────────────────────────────────────────────────
resilience4j:
  ratelimiter:
    instances:
      orderCreate:
        limit-for-period: 100
        limit-refresh-period: 1s
        timeout-duration: 0
        register-health-indicator: true

# ─── Actuator ────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

# ─── Logging ─────────────────────────────────────────────────────────────────
logging:
  file:
    path: /Users/aidenphung/Documents/ShopDA/Log_BE/Order_Logs
  level:
    root: INFO
    com.service.order: DEBUG
    org.springframework.web: INFO


app:
  auth-service:
    url: ${AUTH_SERVICE_URL:http://localhost:8089}

# ─── JWT (RS256 – verify bằng public key lấy từ JWKS của AUTH-SERVICE) ────────
jwt:
  issuer: ${JWT_ISSUER:shopda-auth}
  jwks-uri: ${JWT_JWKS_URI:${app.auth-service.url}/api/v1/auth/.well-known/jwks.json}
  jwks-min-refresh-interval: 30s
  clock-skew: 30s
  blacklist:
    enabled: ${JWT_BLACKLIST_ENABLED:true}
    prefix: "blacklist:"